[project]
name = "plaga-manta"
version = "0.1.0"
description = "Simulador SEIR de la plaga zombie en Manta — Spookython 2026 Track B"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
