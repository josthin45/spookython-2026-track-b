<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="Segoe UI, sans-serif">
  <rect width="1100" height="760" fill="#f7f4ee"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1c1915">Spookython 2026 · Track B · Arquitectura</text>
  <text x="40" y="66" font-size="13" fill="#5e574e">Motor SEIR determinista, separado de la orquestación AWS. Región us-east-1.</text>

  <g font-size="13">
    <rect x="40" y="96" width="1020" height="78" rx="12" fill="#fff" stroke="#e2d9cc"/>
    <text x="56" y="124" font-weight="700">Usuario / jurado</text>
    <text x="56" y="146" fill="#5e574e">Navegador. Ajusta ², ³, K, paciente cero y semilla. Misma semilla, mismo resultado.</text>
  </g>

  <g font-size="13">
    <rect x="40" y="196" width="500" height="92" rx="12" fill="#e7f5ef" stroke="#0f6e56"/>
    <text x="56" y="224" font-weight="700">CloudFront</text>
    <text x="56" y="246" fill="#1c1915">HTTPS público. / sirve el SPA. /api/* va a API Gateway sin caché.</text>
    <rect x="560" y="196" width="500" height="92" rx="12" fill="#e7f5ef" stroke="#0f6e56"/>
    <text x="576" y="224" font-weight="700">S3 frontend (privado, OAC)</text>
    <text x="576" y="246" fill="#1c1915">React / Vite. Sin acceso público directo al bucket.</text>
  </g>

  <g font-size="13">
    <rect x="40" y="312" width="1020" height="92" rx="12" fill="#fff7ea" stroke="#b7791f"/>
    <text x="56" y="340" font-weight="700">API Gateway · REST</text>
    <text x="56" y="362" fill="#1c1915">POST /api/simulate · GET /api/jobs/{id} · GET /api/health · GET /api/defaults</text>
    <text x="56" y="382" fill="#5e574e">CORS acotado a los métodos de la demo. El orquestador valida antes de simular.</text>
  </g>

  <g font-size="13">
    <rect x="40" y="428" width="330" height="120" rx="12" fill="#fff" stroke="#1d4e89"/>
    <text x="56" y="456" font-weight="700">Lambda orquestador</text>
    <text x="56" y="478" fill="#1c1915">Fija la semilla y corre</text>
    <text x="56" y="496" fill="#1c1915">el escenario si cabe en</text>
    <text x="56" y="514" fill="#1c1915">la demo (d 30 corridas).</text>

    <rect x="386" y="428" width="330" height="120" rx="12" fill="#fff" stroke="#1d4e89"/>
    <text x="402" y="456" font-weight="700">Step Functions</text>
    <text x="402" y="478" fill="#1c1915">Distributed Map, tope 20</text>
    <text x="402" y="496" fill="#1c1915">en paralelo. Una corrida</text>
    <text x="402" y="514" fill="#1c1915">por ítem de runs.jsonl.</text>

    <rect x="732" y="428" width="328" height="120" rx="12" fill="#fff" stroke="#1d4e89"/>
    <text x="748" y="456" font-weight="700">Lambda simulador</text>
    <text x="748" y="478" fill="#1c1915">Mismo motor que en local:</text>
    <text x="748" y="496" fill="#1c1915">SEIR + red + estrategia,</text>
    <text x="748" y="514" fill="#1c1915">azar y no intervenir.</text>
  </g>

  <g font-size="13">
    <rect x="40" y="572" width="330" height="110" rx="12" fill="#f3f6fb" stroke="#1d4e89"/>
    <text x="56" y="600" font-weight="700">DynamoDB</text>
    <text x="56" y="622" fill="#1c1915">Estado del trabajo y puntero</text>
    <text x="56" y="640" fill="#1c1915">al JSON. TTL 14 días.</text>

    <rect x="386" y="572" width="330" height="110" rx="12" fill="#f3f6fb" stroke="#1d4e89"/>
    <text x="402" y="600" font-weight="700">S3 resultados</text>
    <text x="402" y="622" fill="#1c1915">Curvas y resumen. Privado.</text>
    <text x="402" y="640" fill="#1c1915">Expira a los 14 días.</text>

    <rect x="732" y="572" width="328" height="110" rx="12" fill="#fff1f0" stroke="#9d2c2c"/>
    <text x="748" y="600" font-weight="700">CloudWatch + Budgets</text>
    <text x="748" y="622" fill="#1c1915">Logs 7 días. Alerta al 50%</text>
    <text x="748" y="640" fill="#1c1915">del tope mensual.</text>
  </g>

  <path d="M550 174 V196 M290 288 V312 M200 404 V428 M550 404 V428 M890 404 V428 M200 548 V572 M550 548 V572" stroke="#8a8175" fill="none"/>
</svg>
